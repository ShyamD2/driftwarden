name: Scheduled Drift Audit

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  drift-audit:
    name: AWS Infrastructure Drift Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Federation)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DRIFTWARDEN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build DriftWarden Binary
        run: go build -o /usr/local/bin/driftwarden ./cmd/driftwarden

      - name: Run Drift & Security Audit
        id: scan
        run: |
          mkdir -p evidence
          driftwarden scan \
            --regions us-east-1,us-west-2 \
            --format json \
            --output evidence/report.json \
            --save-evidence-dir evidence \
            --fail-on-critical=true

      - name: Upload Audit Evidence Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftwarden-audit-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 30
