name: Scheduled Drift Audit

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  drift-audit:
    name: AWS Infrastructure Drift Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check AWS Credentials Configuration
        id: creds
        shell: bash
        run: |
          if [ -n "${{ secrets.AWS_DRIFTWARDEN_ROLE_ARN }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Demo Verification Mode::AWS_DRIFTWARDEN_ROLE_ARN secret not configured. Running DriftWarden simulated verification audit with bundled evidence."
          fi

      - name: Configure AWS Credentials (OIDC Federation)
        if: steps.creds.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DRIFTWARDEN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: 'stable'
          cache: true

      - name: Build DriftWarden Binary
        run: go build -o /usr/local/bin/driftwarden ./cmd/driftwarden

      - name: Run Live Drift & Security Audit
        if: steps.creds.outputs.has_creds == 'true'
        id: scan
        run: |
          mkdir -p evidence
          driftwarden scan \
            --regions us-east-1,us-west-2 \
            --format json \
            --output evidence/report.json \
            --save-evidence-dir evidence \
            --fail-on-critical=true

      - name: Run Simulated Verification Audit (Demo Mode)
        if: steps.creds.outputs.has_creds != 'true'
        run: |
          mkdir -p evidence
          cp -r demo/evidence/* evidence/
          driftwarden explain "aws:aws:ec2:us-east-1:123456789012:security_group/sg-demo-web" --from-scan-dir evidence

      - name: Upload Audit Evidence Bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: driftwarden-audit-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 30
