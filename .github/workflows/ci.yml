name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Module Hygiene
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

      - name: Run Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race -count=1 ./...

      - name: Build Windows and Linux Binaries
        run: |
          GOOS=windows GOARCH=amd64 go build -o bin/driftwarden.exe ./cmd/driftwarden
          GOOS=linux GOARCH=amd64 go build -o bin/driftwarden-linux-amd64 ./cmd/driftwarden
