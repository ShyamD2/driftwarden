name: CI

on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    name: Test & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Module Hygiene
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@fe1dd0c3658873b46f8c9bb3291096a617310ca6 # v1.3.1
        with:
          version: "latest"
          install-go: false

      - name: Run Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race -count=1 ./...

      - name: Build Windows and Linux Binaries
        run: |
          GOOS=windows GOARCH=amd64 go build -o bin/driftwarden.exe ./cmd/driftwarden
          GOOS=linux GOARCH=amd64 go build -o bin/driftwarden-linux-amd64 ./cmd/driftwarden
          GOOS=linux GOARCH=arm64 go build -o bin/driftwarden-linux-arm64 ./cmd/driftwarden
          GOOS=darwin GOARCH=arm64 go build -o bin/driftwarden-darwin-arm64 ./cmd/driftwarden
